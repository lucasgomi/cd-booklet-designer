name: CD Booklet Designer

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Versión a publicar como release (p. ej. v1.0.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Set version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: bash
        env:
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # latest.yml y los .blockmap son lo que lee la actualización automática.
      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: cd-booklet-designer-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.exe dist/latest.yml dist/*.blockmap \
            --title "CD Booklet Designer $TAG" \
            --notes "Versión web (la misma versión, sin instalar): https://lucasgomi.github.io/cd-booklet-designer/" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --repo "${{ github.repository }}"

  # La web sale siempre a la par que la app de escritorio, con la misma versión.
  build-web:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build web
        env:
          WEB_VERSION: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
